name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync

      # Both indexes are built from committed source data, so CI reproduces
      # them from scratch rather than trusting a checked-in vector store.
      - name: Build indexes
        run: |
          PYTHONPATH=. uv run python ingest/build_kb.py
          PYTHONPATH=. uv run python ingest/build_catalog.py

      # A module that does not parse simply never runs, and the page fails
      # silently — no console error reaches any test that reads the file as text.
      # A duplicate top-level `const key` shipped exactly that way once.
      - name: Parse the studio JavaScript
        run: |
          for f in studio viewer palette; do
            node --input-type=module --check < "app/static/$f.js"
          done

      - name: Unit and integration tests
        run: uv run pytest -q

      # The ground-truth evals are the real gate. They exercise geometry,
      # catalogue provenance and plan limits with no model in the loop, so a
      # failure here is a factual regression, not a flaky judgement call.
      - name: Ground-truth evals
        run: PYTHONPATH=. uv run python evals/run_evals.py
