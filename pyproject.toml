[project]
name = "eazli-swarm"
version = "0.1.0"
description = "Agent swarm prototype for eazli: grounded home design + product sourcing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "chromadb>=0.5.20",
    "sentence-transformers>=3.3",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "httpx>=0.27",
    "mcp>=1.1",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
